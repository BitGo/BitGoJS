[node]
name = "bitgo-regtest-snapshot"
working_dir = "/chainstate/stacks-blockchain-miner-data"
rpc_bind = "0.0.0.0:20443"
p2p_bind = "0.0.0.0:20444"
p2p_address = "127.0.0.1:20443"
data_url = "http://127.0.0.1:20443"
seed = "$MINER_SEED"
local_peer_seed = "$MINER_SEED"
miner = true
stacker = false
mine_microblocks = false
wait_time_for_blocks = 0
wait_time_for_microblocks = 0
pox_sync_sample_secs = 0
use_test_genesis_chainstate = true
txindex = true

[miner]
first_attempt_time_ms = 1000
subsequent_attempt_time_ms = 1000
microblock_attempt_time_ms = 10
mining_key = "19ec1c3e31d139c989a23a27eac60d1abfad5277d3ae9604242514c738258efa01"

[connection_options]
disable_block_download = true
disable_inbound_handshakes = false
disable_inbound_walks = false
public_ip_address = "1.1.1.1:1234"

[burnchain]
chain = "bitcoin"
mode = "krypton"
