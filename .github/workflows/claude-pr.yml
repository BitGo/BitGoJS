name: Claude PR

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-pr:
    environment: ai-inference
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      ) && (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: us-west-2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::199765120567:role/${{ github.event.repository.name }}-iam-unprotected
          aws-region: us-west-2

      - name: Assume inference role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::168000258654:role/BedrockInferenceRole
          role-session-name: claude-inference-session
          role-chaining: true
          role-skip-session-tagging: true
          aws-region: us-west-2

      - name: Determine prompt to use
        id: determine-prompt
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Safely trim whitespace and check if it's just @claude
          TRIMMED_COMMENT=$(echo "$COMMENT_BODY" | xargs)

          if [ "$TRIMMED_COMMENT" = "@claude" ]; then
            echo "use-code-review-prompt=true" >> "$GITHUB_OUTPUT"
          else
            echo "use-code-review-prompt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read code review prompt
        id: read-prompt
        if: steps.determine-prompt.outputs.use-code-review-prompt == 'true'
        run: |
          PROMPT_CONTENT=$(cat .github/prompts/code-review.md)
          {
            echo "prompt-content<<EOF"
            echo "$PROMPT_CONTENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@8d70a0dd265122bd65b8e09d3d959e65373ae2a1 # v1.0.260
        if: steps.determine-prompt.outputs.use-code-review-prompt == 'true'
        env:
          ANTHROPIC_MODEL: arn:aws:bedrock:us-west-2:168000258654:inference-profile/global.anthropic.claude-sonnet-5-5
          AWS_REGION: us-west-2
          MAX_THINKING_TOKENS: '0'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: 'true'
          claude_args: --allowed-tools 'Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

            Read this pull request with `gh pr view ${{ github.event.issue.number || github.event.pull_request.number }} --repo ${{ github.repository }}`
            and `gh pr diff ${{ github.event.issue.number || github.event.pull_request.number }} --repo ${{ github.repository }}`.
            Post the final review to the same pull request with `gh pr comment ${{ github.event.issue.number || github.event.pull_request.number }} --repo ${{ github.repository }}`.

            ${{ steps.read-prompt.outputs.prompt-content }}

      - uses: anthropics/claude-code-action@8d70a0dd265122bd65b8e09d3d959e65373ae2a1 # v1.0.260
        if: steps.determine-prompt.outputs.use-code-review-prompt == 'false'
        env:
          ANTHROPIC_MODEL: arn:aws:bedrock:us-west-2:168000258654:inference-profile/global.anthropic.claude-sonnet-5-5
          AWS_REGION: us-west-2
          MAX_THINKING_TOKENS: '0'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_bedrock: 'true'
