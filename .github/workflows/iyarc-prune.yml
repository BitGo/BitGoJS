name: iyarc-prune
run-name: 'iyarc-prune'

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC (weekly)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: iyarc-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: us-west-2
    steps:
      - name: Require master workflow ref
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/master' ]; then
            echo '::error::Run iyarc-prune from master. The AWS role trusts the workflow ref, not the checkout ref. Merge workflow changes before dispatching them.'
            exit 1
          fi

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack (yarn 1.22.22)
        run: corepack enable

      - name: Install release audit scanner
        env:
          OSV_SCANNER_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: node scripts/iyarc-prune.js install-scanner

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::199765120567:role/${{ github.event.repository.name }}-iam-protected
          aws-region: us-west-2

      - name: Assume Bedrock inference role
        id: inference-role
        run: node scripts/iyarc-prune.js assume-inference-role

      - name: Load iyarc-prune agent instructions
        id: agent
        run: node scripts/iyarc-prune.js load-instructions

      - name: Run Claude Code (Bedrock)
        id: claude
        uses: anthropics/claude-code-action@8d70a0dd265122bd65b8e09d3d959e65373ae2a1 # v1.0.260
        with:
          prompt: ${{ steps.agent.outputs.content }}
          claude_args: --allowed-tools 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash'
          use_bedrock: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          IYARC_PRUNE_PR_BODY: ${{ runner.temp }}/iyarc-prune-pr.md
          ANTHROPIC_MODEL: arn:aws:bedrock:us-west-2:168000258654:inference-profile/global.anthropic.claude-sonnet-5-5
          # Bedrock: replaying a tool-call turn requires a leading thinking block; disable to avoid 400.
          MAX_THINKING_TOKENS: '0'
          AWS_REGION: us-west-2
          AWS_ACCESS_KEY_ID: ${{ steps.inference-role.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.inference-role.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.inference-role.outputs.aws-session-token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Agent edits must not change the code that validates or publishes them.
      - name: Write agent report to job summary
        if: always() && steps.claude.outcome != 'skipped'
        env:
          BASE_SHA: ${{ steps.checkout.outputs.commit }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: git show "$BASE_SHA:scripts/iyarc-prune.js" | node - write-agent-summary

      - name: Require successful Claude completion
        if: always() && steps.claude.outcome != 'skipped'
        env:
          BASE_SHA: ${{ steps.checkout.outputs.commit }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: git show "$BASE_SHA:scripts/iyarc-prune.js" | node - require-successful-completion

      - name: Check changes are ready for a pull request
        id: changes
        env:
          BASE_SHA: ${{ steps.checkout.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IYARC_PRUNE_PR_BODY: ${{ runner.temp }}/iyarc-prune-pr.md
        run: git show "$BASE_SHA:scripts/iyarc-prune.js" | node - prepare-pull-request

      - name: Create signed dependency pull request
        if: steps.changes.outputs.ready == 'true'
        id: pull-request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          branch: osv-scanner-prune/${{ github.run_id }}
          base: master
          add-paths: |
            osv-scanner.toml
            package.json
            yarn.lock
            :(glob)modules/*/package.json
          commit-message: |
            chore(deps): prune resolved vulnerability exclusions

            Ticket: HSM-429
          title: 'chore(deps): prune resolved vulnerability exclusions'
          body-path: ${{ runner.temp }}/iyarc-prune-pr.md
          labels: automated,dependencies,security
          assignees: gokulhost
          draft: false

      - name: Report pull request
        if: steps.changes.outputs.ready == 'true'
        env:
          BASE_SHA: ${{ steps.checkout.outputs.commit }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: git show "$BASE_SHA:scripts/iyarc-prune.js" | node - report-pull-request
