name: iyarc-prune
run-name: 'iyarc-prune'

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC (weekly)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: iyarc-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: us-west-2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack (yarn 1.22.22)
        run: corepack enable

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::199765120567:role/${{ github.event.repository.name }}-iam-protected
          aws-region: us-west-2

      - name: Assume Bedrock inference role
        id: inference-role
        run: |
          CREDS="$(aws sts assume-role \
            --role-arn arn:aws:iam::168000258654:role/BedrockInferenceRole \
            --role-session-name iyarc-prune-session \
            --query 'Credentials' \
            --output json)"

          AWS_ACCESS_KEY_ID="$(echo "$CREDS" | jq -r '.AccessKeyId')"
          AWS_SECRET_ACCESS_KEY="$(echo "$CREDS" | jq -r '.SecretAccessKey')"
          AWS_SESSION_TOKEN="$(echo "$CREDS" | jq -r '.SessionToken')"

          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"
          { echo "aws-access-key-id=$AWS_ACCESS_KEY_ID"; echo "aws-secret-access-key=$AWS_SECRET_ACCESS_KEY"; echo "aws-session-token=$AWS_SESSION_TOKEN"; } >> "$GITHUB_OUTPUT"

      - name: Load iyarc-prune agent instructions
        id: agent
        run: |
          {
            echo "content<<IYARC_PRUNE_EOF"
            sed '1,/^---$/d' .claude/agents/iyarc-prune.md
            echo "IYARC_PRUNE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code (Bedrock)
        id: claude
        uses: anthropics/claude-code-action@459ad358ae43fea66bfefd0a1f8d840b4b9791fb # v1.0.194
        with:
          prompt: ${{ steps.agent.outputs.content }}
          use_commit_signing: 'true'
          branch_prefix: 'osv-scanner-prune/'
          claude_args: --allowed-tools 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files'
          use_bedrock: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          ANTHROPIC_MODEL: arn:aws:bedrock:us-west-2:168000258654:inference-profile/us.anthropic.claude-sonnet-4-20250514-v1:0
          # Bedrock: replaying a tool-call turn requires a leading thinking block; disable to avoid 400.
          MAX_THINKING_TOKENS: '0'
          AWS_REGION: us-west-2
          AWS_ACCESS_KEY_ID: ${{ steps.inference-role.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.inference-role.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.inference-role.outputs.aws-session-token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The agent prompt promises a job summary ("report ... in the job summary,
      # including the Still blocked breakdown so the result is auditable"), so
      # render the agent's own report there instead of leaving it log-only.
      - name: Write agent report to job summary
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # Deliberately NOT `set -e`: this step is reporting only and must never
          # be the reason the job goes red. Failures degrade to a note instead.
          set -uo pipefail
          EVENTS=''
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            EVENTS="$(jq -c 'if type=="array" then . else [.] end' "$EXECUTION_FILE" 2>/dev/null)"
          fi
          REPORT=''
          META=''
          if [ -n "$EVENTS" ]; then
            REPORT="$(printf '%s' "$EVENTS" | jq -r '.[] | select(.type=="assistant") | .message.content[]? | select(.type=="text") | .text' 2>/dev/null)"
            # Allowlist, not del(.result): the execution-file schema is upstream and
            # may grow fields we have not audited, so name what we publish.
            META="$(printf '%s' "$EVENTS" | jq -S 'map(select(.type=="result"))[-1] // empty
              | {is_error, subtype, terminal_reason, stop_reason, num_turns,
                 duration_ms, total_cost_usd, session_id,
                 output_tokens: .usage.output_tokens}
              | with_entries(select(.value != null))' 2>/dev/null)"
          fi
          {
            echo "## osv-scanner-prune report"
            echo
            if [ -z "$EVENTS" ]; then
              echo "> No readable Claude execution file was produced — see the agent step logs."
            elif [ -n "$REPORT" ]; then
              echo "$REPORT"
            else
              echo "> The agent produced no text output — see the agent step logs."
            fi
            if [ -n "$META" ]; then
              echo
              echo "<details><summary>Run metadata</summary>"
              echo
              echo '```json'
              echo "$META"
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface Claude error and fail on is_error
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error::no Claude execution file produced"; exit 1
          fi
          EVENTS="$(jq -c 'if type=="array" then . else [.] end' "$EXECUTION_FILE")"
          echo "=== result event (metadata only) ==="
          echo "$EVENTS" | jq -c 'map(select(.type=="result"))[-1] // empty | del(.result)'
          echo "=== assistant text turns (no tool output) ==="
          echo "$EVENTS" | jq -r '.[] | select(.type=="assistant") | .message.content[]? | select(.type=="text") | .text'
          RES="$(echo "$EVENTS" | jq -c 'map(select(.type=="result"))[-1] // empty')"
          if [ "$(echo "$RES" | jq -r '.is_error // false')" = "true" ]; then
            echo "::error::Claude returned is_error=true"; exit 1
          fi
