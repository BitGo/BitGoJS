name: iyarc-prune
run-name: 'iyarc-prune'

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC (weekly)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: iyarc-prune
  cancel-in-progress: false

jobs:
  prune:
    environment: ai-inference
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: us-west-2
    steps:
      - name: Require master workflow ref
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/master' ]; then
            echo '::error::Run iyarc-prune from master. Merge workflow changes before dispatching them.'
            exit 1
          fi

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack (yarn 1.22.22)
        run: corepack enable

      - name: Install release audit scanner
        env:
          OSV_SCANNER_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: node scripts/iyarc-prune.js install-scanner

      - name: Authenticate workflow with AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::199765120567:role/${{ github.event.repository.name }}-iam-unprotected
          aws-region: us-west-2

      - name: Obtain credentials for the Bedrock model service
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::168000258654:role/BedrockInferenceRole
          role-session-name: iyarc-prune-session
          role-chaining: true
          role-skip-session-tagging: true
          aws-region: us-west-2

      - name: Load iyarc-prune agent instructions
        id: agent
        run: node scripts/iyarc-prune.js load-instructions

      - name: Run agent to validate dependency edits and write pull request body
        id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          prompt: ${{ steps.agent.outputs.content }}
          claude_args: --allowed-tools 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash'
          use_bedrock: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          IYARC_PRUNE_PR_BODY: ${{ runner.temp }}/iyarc-prune-pr.md
          ANTHROPIC_MODEL: arn:aws:bedrock:us-west-2:168000258654:inference-profile/global.anthropic.claude-sonnet-5-5
          # Bedrock: replaying a tool-call turn requires a leading thinking block; disable to avoid 400.
          MAX_THINKING_TOKENS: '0'
          AWS_REGION: us-west-2
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: "!gh auth git-credential"

      - name: Load trusted workflow helper from the original checkout
        id: trusted-helper
        if: always() && steps.claude.outcome != 'skipped'
        env:
          BASE_SHA: ${{ steps.checkout.outputs.commit }}
        # Loading after the agent finishes prevents its working-copy edits from changing publication checks.
        run: git show "$BASE_SHA:scripts/iyarc-prune.js" > "$RUNNER_TEMP/iyarc-prune-workflow.js"

      - name: Write agent report to job summary
        if: always() && steps.claude.outcome != 'skipped'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node "$RUNNER_TEMP/iyarc-prune-workflow.js" write-agent-summary

      - name: Require successful Claude completion
        if: always() && steps.claude.outcome != 'skipped'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node "$RUNNER_TEMP/iyarc-prune-workflow.js" require-successful-completion

      - name: Check allowed edits and prepare Git state for publication
        id: publication
        env:
          BASE_SHA: ${{ steps.checkout.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IYARC_PRUNE_PR_BODY: ${{ runner.temp }}/iyarc-prune-pr.md
        run: node "$RUNNER_TEMP/iyarc-prune-workflow.js" prepare-pull-request

      - name: Create signed dependency pull request
        if: steps.publication.outputs.ready == 'true'
        id: pull-request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          branch: osv-scanner-prune/${{ github.run_id }}
          base: master
          add-paths: |
            osv-scanner.toml
            package.json
            yarn.lock
            :(glob)modules/*/package.json
          commit-message: |
            chore(deps): prune resolved vulnerability exclusions

            Ticket: HSM-429
          title: 'chore(deps): prune resolved vulnerability exclusions'
          body-path: ${{ runner.temp }}/iyarc-prune-pr.md
          labels: automated,dependencies,security
          assignees: gokulhost
          draft: false

      - name: Report pull request
        if: steps.publication.outputs.ready == 'true'
        env:
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: node "$RUNNER_TEMP/iyarc-prune-workflow.js" report-pull-request
